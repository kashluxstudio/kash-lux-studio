name = "cashflow-connect-api"
main = "src/index.js"
compatibility_date = "2026-11-05"
[[d1_databases]]
binding = "DB"
database_name = "cashflow-connect"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"
[vars]
ACCESS_ISSUER = "https://REPLACE_WITH_TEAM.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_WITH_ACCESS_APPLICATION_AUD"
APP_ORIGIN = "https://REPLACE_WITH_APP_HOSTNAME"
